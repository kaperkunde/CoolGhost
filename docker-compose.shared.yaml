services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.0}
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_USER: ${MYSQL_USER:-plekje}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plekje}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
    volumes:
      - "mysql-data:/var/lib/mysql"
    depends_on:
      traffic-analytics:
        condition: service_healthy
      traffic-stats:
        condition: service_healthy
    healthcheck:
      test: mysqladmin ping -p$$MYSQL_ROOT_PASSWORD -h 127.0.0.1
      interval: 1s
      start_period: 30s
      start_interval: 5s
      timeout: 20s
      retries: 10

  api:
    build: ./api
    restart: always
    environment:
      - PORT=3000
      - SERVICE_URL_API
      - SERVICE_URL_API_3000=${SERVICE_URL_API}
      - API_TOKEN=${API_TOKEN:-${SERVICE_BASE64_TOKEN}}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
      - STAGING_DIR=/staging
      - VOLUMES_DIR=/local/volumes
      - DUPLICATI_URL=http://duplicati:8200
      - DUPLICATI_PASSWORD=${SERVICE_PASSWORD_DUPLICATI}
      - DUPLICATI_STAGING_DIR=/staging
    volumes:
      - "/var/lib/docker/volumes:/local/volumes"
      - "/root/data/dev/ghosthost-staging:/staging"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q -O- http://127.0.0.1:3000/health | grep -q ''"mysql":true''',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  clickhouse:
    build: ./clickhouse
    restart: always
    environment:
      CLICKHOUSE_DB: ghost_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  traffic-stats:
    build: ./traffic-stats
    restart: always
    environment:
      PORT: 3000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ghost_analytics
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:3000/v0/health | grep -q ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  traffic-analytics:
    image: ghost/traffic-analytics:${TRAFFIC_ANALYTICS_VERSION:-1.0.244@sha256:98aba0319ef32634c1be41362a322343e71dc8ac6bd31b426a8e115ad14c3b8e}
    platform: linux/amd64
    restart: always
    environment:
      PROXY_TARGET: http://traffic-stats:3000/v0/events
      TINYBIRD_WAIT: "true"
      TRUST_PROXY: "true"
    depends_on:
      traffic-stats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ | grep -q Ghost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  duplicati:
    build: ./duplicati
    restart: always
    environment:
      - SERVICE_URL_DUPLICATI
      - SERVICE_URL_DUPLICATI_8200=${SERVICE_URL_DUPLICATI_8200}
      - PUID=0
      - PGID=0
      - "TZ=${TZ:-Europe/Amsterdam}"
      - "SETTINGS_ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPT}"
      - "DUPLICATI__WEBSERVICE_PASSWORD=${SERVICE_PASSWORD_DUPLICATI}"
      - "MYSQL_HOST=mysql"
      - "MYSQL_PORT=3306"
      - "MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}"
      # First-run provisioning of the stock hourly/daily backup jobs. Runs once
      # per volume (marker: /config/coolghost-bootstrap.json); existing jobs are
      # never touched. Set DUPLICATI_BOOTSTRAP_ENABLED=false to configure by hand.
      - "DUPLICATI_BOOTSTRAP_ENABLED=${DUPLICATI_BOOTSTRAP_ENABLED:-true}"
      # KEEP THIS SAFE: without it the backups cannot be restored, on this host
      # or any other. Defaults to the same key Duplicati encrypts its own
      # settings with, so Coolify generates and persists it for you.
      - "DUPLICATI_BACKUP_PASSPHRASE=${DUPLICATI_BACKUP_PASSPHRASE:-${SERVICE_PASSWORD_ENCRYPT}}"
      # Point the daily job at off-host storage (any Duplicati backend URL,
      # e.g. s3://bucket/path?auth-username=...) — local disk alone does not
      # survive losing the server.
      - "DUPLICATI_DAILY_TARGET_URL=${DUPLICATI_DAILY_TARGET_URL:-file:///backups/daily}"
      - "DUPLICATI_DAILY_AT=${DUPLICATI_DAILY_AT:-03:30}"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - "/root/data/dev/duplicati/config:/config"
      - "/root/data/dev/duplicati/backups:/backups"
      - "/var/lib/docker/volumes:/local/volumes"
      - "/root/data/dev/db_dumps:/data/db_dumps"
      - "/data/coolify:/data/coolify:ro"
      # Shared staging mount — restore target for export/restore jobs run by the api service.
      - "/root/data/dev/ghosthost-staging:/staging"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://127.0.0.1:8200"
      interval: 2s
      timeout: 10s
      retries: 15

volumes:
  mysql-data:
  clickhouse-data:
