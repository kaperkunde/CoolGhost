services:
  caddy:
    build: ./caddy
    restart: always
    environment:
      - SERVICE_URL_CADDY
      - CADDY_LOG_OUTPUT=${CADDY_LOG_OUTPUT:-discard}
      - CADDY_PORT=${CADDY_PORT:-80}
    expose:
      - "${CADDY_PORT:-80}"
    depends_on:
      ghost:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'wget -q -O /dev/null -T 4 --header="X-Forwarded-Proto: https" http://127.0.0.1:$${CADDY_PORT}/ghost/api/admin/site/'
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 120s
  ghost:
    image: ghost:${GHOST_VERSION:-6.43.1-alpine@sha256:b03393a2565a72179b18a608f672a60f8e66c9417f7dee1625d0718bf0b320dc}
    environment:
      url: ${SERVICE_URL_CADDY}
      NODE_ENV: production
      admin__url: ${SERVICE_URL_CADDY}
      database__client: mysql
      database__connection__host: ${MYSQL_HOST:-mysql}
      database__connection__port: ${MYSQL_PORT:-3306}
      database__connection__user: ${SERVICE_USER_MYSQL}
      database__connection__password: ${SERVICE_PASSWORD_MYSQL}
      database__connection__database: ${GHOST_DATABASE:-ghost}
      mail__transport: SMTP
      mail__from: ${MAIL_FROM}
      mail__options__auth__pass: ${MAIL_OPTIONS_AUTH_PASS}
      mail__options__auth__user: ${MAIL_OPTIONS_AUTH_USER}
      mail__options__secure: ${MAIL_OPTIONS_SECURE:-true}
      mail__options__port: ${MAIL_OPTIONS_PORT:-465}
      mail__options__service: ${MAIL_OPTIONS_SERVICE:-Mailgun}
      mail__options__host: ${MAIL_OPTIONS_HOST}
      analytics__enabled: "true"
      tinybird__tracker__endpoint: ${SERVICE_URL_CADDY}/.ghost/analytics/api/v1/page_hit
      labs__publicAPI: ${LABS_PUBLIC_API:-false}
      tinybird__adminToken: DUMMY_TOKEN
      tinybird__workspaceId: DUMMY_WORKSPACE_ID
      tinybird__tracker__datasource: analytics_events
      tinybird__stats__endpoint: ${SERVICE_URL_CADDY}/.ghost/stats
      tinybird__stats__endpointBrowser: ${SERVICE_URL_CADDY}/.ghost/stats
    volumes:
      - 'ghost-content-data:/var/lib/ghost/content'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'wget -q -O /dev/null -T 4 --header="X-Forwarded-Proto: https" http://127.0.0.1:2368/ghost/api/admin/site/'
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 120s
  mysql:
    image: mysql:${MYSQL_VERSION:-8@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084}
    restart: always
    environment:
      MYSQL_USER: ${SERVICE_USER_MYSQL}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      MYSQL_DATABASE: ${GHOST_DATABASE:-ghost}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
    volumes:
      - 'ghost-mysql-data:/var/lib/mysql'
    healthcheck:
      test: mysqladmin ping -p$$MYSQL_ROOT_PASSWORD -h 127.0.0.1
      interval: 1s
      start_period: 30s
      start_interval: 5s
      timeout: 20s
      retries: 10
  clickhouse:
    build: ./clickhouse
    restart: always
    environment:
      CLICKHOUSE_DB: ghost_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ghost-clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  traffic-stats:
    build: ./traffic-stats
    restart: always
    environment:
      PORT: 3000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ghost_analytics
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/v0/health | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  traffic-analytics:
    image: ghost/traffic-analytics:${TRAFFIC_ANALYTICS_VERSION:-1.0.244@sha256:98aba0319ef32634c1be41362a322343e71dc8ac6bd31b426a8e115ad14c3b8e}
    platform: linux/amd64
    restart: always
    environment:
      PROXY_TARGET: http://traffic-stats:3000/v0/events
      TINYBIRD_WAIT: "true"
      TRUST_PROXY: "true"
    depends_on:
      traffic-stats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ | grep -q Ghost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
volumes:
  ghost-content-data:
  ghost-mysql-data:
  ghost-clickhouse-data:
