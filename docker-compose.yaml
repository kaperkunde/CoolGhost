services:
  caddy:
    build: ./caddy
    restart: always
    environment:
      - SERVICE_URL_CADDY
      - CADDY_LOG_OUTPUT=${CADDY_LOG_OUTPUT:-discard}
      - CADDY_PORT=${CADDY_PORT:-80}
      - TRAFFIC_STATS_HOST=${TRAFFIC_STATS_HOST:-traffic-stats}
      - TRAFFIC_ANALYTICS_HOST=${TRAFFIC_ANALYTICS_HOST:-traffic-analytics}
    expose:
      - "${CADDY_PORT:-80}"
    depends_on:
      ghost:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'wget -q -O /dev/null -T 4 --header="X-Forwarded-Proto: https" http://127.0.0.1:$${CADDY_PORT}/ghost/api/admin/site/'
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 120s
  ghost:
    image: ghost:${GHOST_VERSION:-6.43.1-alpine@sha256:b03393a2565a72179b18a608f672a60f8e66c9417f7dee1625d0718bf0b320dc}
    environment:
      url: ${SERVICE_URL_CADDY}
      NODE_ENV: production
      admin__url: ${SERVICE_URL_CADDY}
      database__client: mysql
      database__connection__host: ${MYSQL_HOST}
      database__connection__port: ${MYSQL_PORT:-3306}
      database__connection__user: ${SERVICE_USER_MYSQL}
      database__connection__password: ${SERVICE_PASSWORD_MYSQL}
      database__connection__database: ${GHOST_DATABASE:-ghost}
      mail__transport: SMTP
      mail__from: ${MAIL_FROM}
      mail__options__auth__pass: ${MAIL_OPTIONS_AUTH_PASS}
      mail__options__auth__user: ${MAIL_OPTIONS_AUTH_USER}
      mail__options__secure: ${MAIL_OPTIONS_SECURE:-true}
      mail__options__port: ${MAIL_OPTIONS_PORT:-465}
      mail__options__service: ${MAIL_OPTIONS_SERVICE:-Mailgun}
      mail__options__host: ${MAIL_OPTIONS_HOST}
      analytics__enabled: "true"
      tinybird__tracker__endpoint: ${SERVICE_URL_CADDY}/.ghost/analytics/api/v1/page_hit
      labs__publicAPI: ${LABS_PUBLIC_API:-false}
      tinybird__adminToken: DUMMY_TOKEN
      tinybird__workspaceId: DUMMY_WORKSPACE_ID
      tinybird__tracker__datasource: analytics_events
      tinybird__stats__endpoint: ${SERVICE_URL_CADDY}/.ghost/stats
      tinybird__stats__endpointBrowser: ${SERVICE_URL_CADDY}/.ghost/stats
    volumes:
      - 'ghost-content-data:/var/lib/ghost/content'
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'wget -q -O /dev/null -T 4 --header="X-Forwarded-Proto: https" http://127.0.0.1:2368/ghost/api/admin/site/'
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 120s
volumes:
  ghost-content-data:
