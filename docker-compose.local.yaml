# Local overrides: publish Caddy on the host at CADDY_PORT (default 3000).
services:
  ghost:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      tinybird__stats__endpoint: http://caddy:${CADDY_PORT:-3000}/.ghost/stats
  caddy:
    ports:
      - "${CADDY_PORT:-3000}:${CADDY_PORT:-3000}"
    # The base file names the upstreams <service>.<project>, which Coolify's
    # network (named after the project) resolves. Plain Compose names its
    # network <project>_default, so locally the bare service names are used.
    environment:
      - GHOST_UPSTREAM=ghost
      - TRAFFIC_STATS_UPSTREAM=traffic-stats
      - TRAFFIC_ANALYTICS_UPSTREAM=traffic-analytics
