services:
  api:
    build: ./api
    restart: always
    environment:
      PORT: 3000
      API_TOKEN: ${API_TOKEN:-${SERVICE_BASE64_TOKEN}}
      # Required on Coolify: shared MySQL stack hostname (custom name + trailing dash).
      MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST to the shared MySQL hostname, e.g. mysql-ghost-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${SERVICE_PASSWORD_MYSQLROOT}}
      # Export/restore support (optional). Leave DUPLICATI_URL unset when no
      # duplicati stack is reachable — backup-sourced export/restore then 503s
      # while current-data export keeps working via the volume mounts below.
      STAGING_DIR: /staging
      VOLUMES_DIR: /local/volumes
      DUPLICATI_URL: ${DUPLICATI_URL:-}
      DUPLICATI_PASSWORD: ${DUPLICATI_PASSWORD:-}
      DUPLICATI_STAGING_DIR: ${DUPLICATI_STAGING_DIR:-/staging}
      # Redirect-domain support: Coolify's Traefik file-provider dir. The
      # api writes per-redirect dynamic configs there; Traefik hot-reloads.
      PROXY_DYNAMIC_DIR: /proxy-dynamic
      TRAEFIK_CERT_RESOLVER: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
    volumes:
      - "/var/lib/docker/volumes:/local/volumes"
      # Export artifacts, restore uploads and job state; served to the GhostHost
      # app over /v1/data. Mount the same host dir into duplicati at /staging.
      - "${STAGING_HOST_DIR:-/root/data/ghosthost-staging}:/staging"
      - "${PROXY_DYNAMIC_HOST_DIR:-/data/coolify/proxy/dynamic}:/proxy-dynamic"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:3000/health | grep -q '\"mysql\":true'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
